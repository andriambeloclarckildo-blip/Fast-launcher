name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FastLauncher.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build
        working-directory: FastLauncher
        run: gradle assembleDebug --no-daemon
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" FastLauncher/app/build/outputs/apk/debug/app-debug.apk --title "Fast Launcher v${{ github.run_number }}" --notes "APK"
